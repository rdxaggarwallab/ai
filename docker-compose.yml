# Starts the database, API and web app:  docker compose up --build
# Then open http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://lms:lms@db:5432/lms
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-key-change-me-in-production-0000}
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["5000:5000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    environment:
      API_URL: http://api:5000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  dbdata:
  uploads:
