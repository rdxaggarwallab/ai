# Production web server: serves the built React app and forwards /api to Flask.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 21m;   # uploads are limited to 20 MB by the API

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        # One trusted hop: Flask (TRUSTED_PROXIES=1) reads the real client IP from here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Python runtime files are large and never change for a version: cache them.
    location /pyodide/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths load index.html, React picks the page.
    location / {
        try_files $uri /index.html;
    }
}
